services:
  # PostgreSQL. Its data persists in the postgres_data volume.
  db:
    image: postgres:16-alpine
    container_name: nutricommunity-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port:container port.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # PostgreSQL executes these scripts when the database is initialized.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The service is ready when PostgreSQL accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_network

  # One-shot container for creating/applying migrations.
  # It exits successfully after running pnpm db:migrate.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutricommunity-migrate
    # Run once per `docker compose up` and remain stopped after success.
    restart: "no"
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  # Express API and authentication.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutricommunity-backend
    command: pnpm start
    environment:
      NODE_ENV: ${NODE_ENV}
      # The API listens on port 4000 inside the container.
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      CSRF_SECRET: ${CSRF_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      # Host port 3000 maps to container port 4000.
      - "3000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend_network

volumes:
  # Persistent PostgreSQL volume.
  postgres_data:

networks:
  # Private network shared by PostgreSQL, migrations, and the backend.
  backend_network:
    driver: bridge
